[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "crc-lodo-bench"
version = "0.1.0"
description = "Country-aware leave-one-dataset-out benchmarking for shotgun metagenomic CRC classification"
readme = "src/crc_lodo_bench/README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "metagenomics",
    "colorectal-cancer",
    "machine-learning",
    "cross-validation",
    "leave-one-dataset-out",
    "lodo",
    "benchmarking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

authors = [
    { name = "Alejandro Velazquez", email = "alejandro-publius@berkeley.edu" },
    { name = "Rachel Selbrede" },
]

dependencies = [
    "certifi>=2024.2.2",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "shap>=0.44",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
adenoma = [
    "imbalanced-learn>=0.12",
]
test = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/alejandro-publius/crc-metagenomics"
Repository = "https://github.com/alejandro-publius/crc-metagenomics"
Issues = "https://github.com/alejandro-publius/crc-metagenomics/issues"

# Author ORCID identifiers (not part of PEP 621 metadata; recorded here for
# provenance and consumption by CITATION.cff / .zenodo.json tooling):
#   Alejandro Velazquez : 0009-0007-9798-1958
#   Rachel Selbrede     : 0009-0006-7046-3192

[tool.hatch.build.targets.wheel]
packages = ["src/crc_lodo_bench"]

[tool.hatch.build.targets.sdist]
include = [
    "src/crc_lodo_bench",
    "LICENSE",
    "pyproject.toml",
]
